name: 每日订单同步(jiahui)

on:
  schedule:
    # 北京时间 7:30, 8:30, 9:30, 11:25, 12:10, 13:10, 14:10, 15:10, 16:10, 17:10, 18:10, 19:00, 20:30, 22:00
    - cron: '30 23 * * *'
    - cron: '30 0 * * *'
    - cron: '30 1 * * *'
    - cron: '25 3 * * *'
    - cron: '10 4 * * *'
    - cron: '10 5 * * *'
    - cron: '10 6 * * *'
    - cron: '10 7 * * *'
    - cron: '10 8 * * *'
    - cron: '10 9 * * *'
    - cron: '10 10 * * *'
    - cron: '0 11 * * *'
    - cron: '30 12 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch: {}

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 安装 DrissionPage + bs4 + requests，并确保系统有 Chrome
      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      # 设置 CI 环境变量，让 spider_jiahui 自动启用无头模式
      - name: 运行 spider_jiahui 抓取 jiahui
        env:
          CI: 'true'
        run: python spider_jiahui.py

      - name: 推送 jiahui 到秒哒
        env:
          EDGE_URL: ${{ secrets.SUPABASE_EDGE_URL }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: python push_to_miaoda.py result_jiahui.txt jiahui "$EDGE_URL" "$SYNC_KEY"
